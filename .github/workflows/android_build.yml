name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://lhnogjmeyqbuoiruykpw.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_t4svZ8krxb9VqkPA0epoDQ_s-av_vnE

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: kwsc-tracking-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
